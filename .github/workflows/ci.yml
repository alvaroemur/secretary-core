name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  leak-guard:
    name: Leak guard + skill distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Leak guard (no sensitive literals in tracked files)
        run: python scripts/ci/check_no_leaks.py

      - name: Codex rules installer regression
        run: python -m unittest discover -s tests -p test_codex_rules.py -v

      # skills/ and playbooks/ are the single versioned source (no private copies),
      # so the distribution tests run against the real tree.
      - name: Skill distribution regression
        run: python -m unittest discover -s tests -p test_close_distribution.py -v
